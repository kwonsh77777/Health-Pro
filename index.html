    <title>Health Pro - AI 피트니스 매니저</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* 구글 보안 배너(상단 30px)를 화면 바깥 상단 영역으로 밀어 올려 강제로 숨기는 오프셋 기법 */
        iframe {
            width: 100%;
            height: calc(100% + 30px);
            border: none;
            margin-top: -30px;
        }
    </style>
</head>
